[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emlusb6003"
version = "0.1.0"
description = "Driver for the NI USB-6003 and NI's OEM version of it, over USB with pyusb and libusb"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["pyusb>=1.2"]
authors = [{ name = "Ian Howell" }]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["emlusb6003"]
