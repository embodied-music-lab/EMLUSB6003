<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USB-6003 live values</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1b1f23; --muted: #5b6570; --line: #cfd6dd; --accent: #0b5cad; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14181c; --fg: #e8ecef; --muted: #98a3ad; --line: #35404a; --accent: #6db3f2; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; max-width: 52rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  p.note { color: var(--muted); margin: 0 0 1rem; }
  fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 0 0 1rem; padding: .75rem 1rem; }
  legend { padding: 0 .4rem; color: var(--muted); }
  label { display: inline-block; margin-right: 1rem; }
  input[type=text], input[type=number] { font: inherit; padding: .25rem .4rem; width: 12rem; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; }
  input[type=number] { width: 7rem; }
  button { font: inherit; padding: .4rem .9rem; margin: .25rem .5rem .25rem 0; border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 4px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: .2rem .6rem; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  #status { min-height: 1.5em; margin: .5rem 0; }
  #log { font: 13px/1.4 ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; max-height: 10rem; overflow: auto; }
</style>
</head>
<body>
<h1>USB-6003 live values</h1>
<p class="note">Open this page over http://localhost or https. Chrome asks you to pick the card.</p>

<fieldset>
  <legend>1. Card</legend>
  <button id="connect">Choose a card</button>
  <label><input type="checkbox" id="simulated"> Use a simulated card (synthetic values, no hardware)</label>
  <div id="status" role="status"></div>
</fieldset>

<fieldset>
  <legend>2. Inputs and rate</legend>
  <label>Inputs, in order <input type="text" id="inputs" value="0,1,2,3,4,5,6,7" aria-describedby="inputsHelp"></label>
  <label>Rate for each input <input type="number" id="rate" value="1000" min="1" step="any"></label>
  <div id="inputsHelp" class="note">Numbers 0 to 7 for ai0 to ai7. Any order. Repeats are allowed.</div>
  <button id="configure" disabled>Configure</button>
  <button id="start" disabled>Start</button>
  <button id="stop" disabled>Stop</button>
  <button id="close" disabled>Close</button>
</fieldset>

<table aria-live="off">
  <thead><tr><th>Entry</th><th>Latest (V)</th><th>Lowest (V)</th><th>Highest (V)</th><th>Latest count</th></tr></thead>
  <tbody id="values"></tbody>
</table>
<p id="totals" class="note"></p>
<div id="log" aria-live="polite"></div>
<script type="module" src="example.js"></script>
</body>
</html>
